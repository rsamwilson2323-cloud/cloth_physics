<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClothLab — Interactive Fabric Physics</title><style>*{box-sizing:border-box}body{margin:0;background:#090b17;color:#edf0ff;font:14px system-ui,Segoe UI,sans-serif}header{padding:18px 24px;border-bottom:1px solid #30314b;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:23px}h1 span{color:#b39aff}.tag{color:#a8a9c3}main{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 75px)}aside{background:#111427;padding:23px;border-right:1px solid #30314b}label{display:flex;justify-content:space-between;margin:19px 0 8px;color:#d6d6eb}input[type=range]{width:100%;accent-color:#a788ff}button{background:#292541;border:1px solid #51496d;color:white;border-radius:10px;padding:11px 14px;cursor:pointer;font-weight:600}button:hover{background:#45366c}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:23px}.primary{background:#7855d9}.stage{position:relative;min-height:520px;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#222345,#0b0e1d 70%)}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}.hint{position:absolute;bottom:18px;left:20px;color:#c1bcd6;background:#14172bd9;padding:10px 14px;border:1px solid #363451;border-radius:10px;pointer-events:none}.sub{color:#b5a5e5;font-size:12px;letter-spacing:2px;font-weight:700}select{width:100%;background:#211d35;color:white;border:1px solid #51496d;padding:10px;border-radius:8px}@media(max-width:700px){main{grid-template-columns:1fr}aside{border-right:0;display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.buttons{grid-column:1/-1}.stage{height:60vh;min-height:420px}header{padding:14px}}</style></head><body><header><h1>◈ Cloth<span>Lab</span></h1><div class="tag">INTERACTIVE PHYSICS ENGINE</div></header><main><aside><div style="grid-column:1/-1" class="sub">SIMULATION CONTROLS</div><div><label>Gravity <output id="gv">0.40</output></label><input id="gravity" type="range" min="0" max="1.2" value="0.4" step="0.05"></div><div><label>Wind <output id="wv">0.20</output></label><input id="wind" type="range" min="0" max="2" value="0.2" step="0.05"></div><div><label>Stiffness <output id="sv">0.80</output></label><input id="stiff" type="range" min="0.2" max="1" value="0.8" step="0.05"></div><div><label>Cloth density <output id="dv">24</output></label><input id="density" type="range" min="12" max="38" value="24" step="2"></div><div style="grid-column:1/-1"><label>Interaction mode</label><select id="mode"><option value="drag">✋ Drag fabric</option><option value="cut">✂ Cut fabric</option></select></div><div class="buttons"><button class="primary" id="pause">⏸ Pause</button><button id="reset">↻ Reset</button><button id="unpin">⌄ Release pins</button><button id="repin">⌃ Pin corners</button></div><p style="grid-column:1/-1;color:#9396b3;line-height:1.6">Drag the fabric to deform it. Switch to Cut to tear the cloth. Change density to rebuild the mesh.</p></aside><section class="stage"><canvas id="canvas"></canvas><div class="hint">✋ Drag to pull fabric · ✂ Cut to tear · Change settings live</div></section></main><script>const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');let W,H,points=[],links=[],cols,rows,spacing,playing=true,grabbed=null,pointer=null,clock=0;const $=id=>document.getElementById(id);['gravity','wind','stiff','density'].forEach((id)=>$(id).addEventListener('input',()=>{ $(id[0]+'v').value=$(id).value;if(id==='density')init()}));function resize(){let r=canvas.getBoundingClientRect();W=r.width;H=r.height;canvas.width=Math.round(W*devicePixelRatio);canvas.height=Math.round(H*devicePixelRatio);ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);init()}window.addEventListener('resize',resize);function init(){points=[];links=[];cols=+$('density').value;spacing=Math.min(18,Math.max(8,(W-65)/(cols-1)));rows=Math.max(9,Math.min(26,Math.round(cols*.72)));const x0=(W-(cols-1)*spacing)/2,y0=Math.max(55,H*.13);for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let px=x0+x*spacing,py=y0+y*spacing;points.push({x:px,y:py,oldx:px,oldy:py,pinned:y===0&&(x===0||x===cols-1||x%5===0)})}function link(a,b){links.push({a,b,len:Math.hypot(points[a].x-points[b].x,points[a].y-points[b].y)})}for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let i=y*cols+x;if(x)link(i,i-1);if(y)link(i,i-cols)}grabbed=null}function physics(){clock+=.025;let g=+$('gravity').value,wind=+$('wind').value;for(const p of points){if(p.pinned)continue;let vx=(p.x-p.oldx)*.992,vy=(p.y-p.oldy)*.992;p.oldx=p.x;p.oldy=p.y;p.x+=vx+Math.sin(clock+p.y*.014)*wind*.3;p.y+=vy+g;p.x=Math.max(4,Math.min(W-4,p.x));p.y=Math.max(4,Math.min(H-4,p.y))}if(grabbed&&pointer){grabbed.x=pointer.x;grabbed.y=pointer.y;grabbed.oldx=grabbed.x;grabbed.oldy=grabbed.y}let stiff=+$('stiff').value;for(let k=0;k<5;k++)for(const l of links){let a=points[l.a],b=points[l.b],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,adjust=(d-l.len)/d*.5*stiff,ox=dx*adjust,oy=dy*adjust;if(!a.pinned&&a!==grabbed){a.x+=ox;a.y+=oy}if(!b.pinned&&b!==grabbed){b.x-=ox;b.y-=oy}}}function draw(){ctx.clearRect(0,0,W,H);ctx.lineWidth=1.2;ctx.strokeStyle='rgba(166,133,255,.68)';ctx.beginPath();for(const l of links){let a=points[l.a],b=points[l.b];ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y)}ctx.stroke();for(const p of points){if(p.pinned){ctx.beginPath();ctx.arc(p.x,p.y,3.5,0,Math.PI*2);ctx.fillStyle='#ffca7b';ctx.fill()}}if(grabbed){ctx.beginPath();ctx.arc(grabbed.x,grabbed.y,8,0,Math.PI*2);ctx.strokeStyle='#fff';ctx.stroke()}}function frame(){if(playing)physics();draw();requestAnimationFrame(frame)}function pos(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function cut(p){links=links.filter(l=>{let a=points[l.a],b=points[l.b],dx=b.x-a.x,dy=b.y-a.y,t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy||1)));return Math.hypot(p.x-(a.x+t*dx),p.y-(a.y+t*dy))>12})}canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointer=pos(e);if($('mode').value==='cut'){cut(pointer);return}let closest=null,dist=35;for(const p of points){let d=Math.hypot(p.x-pointer.x,p.y-pointer.y);if(d<dist&&!p.pinned){closest=p;dist=d}}grabbed=closest});canvas.addEventListener('pointermove',e=>{if(!pointer)return;pointer=pos(e);if($('mode').value==='cut')cut(pointer)});function end(){pointer=null;grabbed=null}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);$('pause').onclick=()=>{playing=!playing;$('pause').textContent=playing?'⏸ Pause':'▶ Resume'};$('reset').onclick=init;$('unpin').onclick=()=>points.forEach(p=>p.pinned=false);$('repin').onclick=()=>{points.forEach(p=>p.pinned=false);points[0].pinned=true;points[cols-1].pinned=true};resize();requestAnimationFrame(frame);</script></body></html>
